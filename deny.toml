[advisories]
# Do not suppress advisories without a documented, reviewed exception.
ignore = []

[bans]
# Report duplicate dependency versions without blocking initial adoption.
multiple-versions = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# Keep the allowlist forward-compatible without failing on licenses absent from this dependency graph.
unused-allowed-license = "allow"
# Accept the CCADB-derived Mozilla root certificate data only for this crate.
exceptions = [
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Permit only the immutable Eclipse OpenSOVD source used by the isolated prototype.
allow-git = ["https://github.com/eclipse-opensovd/opensovd-core"]
