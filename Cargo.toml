[workspace]
resolver = "2"
members = [
    "crates/diagnostic-common",
    "crates/virtual-ecu",
    "crates/sovd-server",
    "crates/vehicle-topology",
    "crates/uds-protocol",
    "crates/doip-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls-pki-types = { version = "1", features = ["std"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }