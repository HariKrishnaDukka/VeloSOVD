[package]
name = "velosovd-studio"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "VeloSOVD Studio - SOVD diagnostic tool (desktop shell)"

# Not part of the main workspace: needs webkit2gtk to build (own CI job).
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
studio-core = { path = "../../crates/studio-core" }
